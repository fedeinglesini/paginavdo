<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación - Sitio Vuelta de Obligado</title>
    <!-- Logo en la pestaña del navegador (sube un nivel con ../) -->
    <link rel="icon" type="image/png" href="../logoizq.png">
    <style>
        /* Estilos generales con scroll suave */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #0f172a;
            margin: 0;
            padding: 0;
        }

        * {
            box-sizing: border-box;
        }

        /* --- 1. BANNER SUPERIOR --- */
        header {
            background: linear-gradient(rgba(27, 42, 74, 0.70), rgba(27, 42, 74, 0.70)), url('../fondosuperior.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 2.2rem 2rem;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            border: none;
        }

        .header-logo-left, .header-logo-right {
            width: 135px;
            height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-logo-left img, .header-logo-right img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
        }

        .header-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0 0.5rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            flex-grow: 1;
        }

        /* --- 2. BARRA DE NAVEGACIÓN --- */
        nav {
            background-color: #1b2a4a; /* Azul histórico de la Confederación */
            display: flex;
            justify-content: flex-start;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin: 0;
            overflow-x: auto; 
            white-space: nowrap;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.7rem 1.2rem;
            background-color: transparent;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease;
            border: none;
            outline: none;
        }

        nav a:hover {
            background-color: #d31d1d; 
            color: #ffffff;
        }

        /* --- 3. SECCIÓN CENTRAL --- */
        section {
            background: linear-gradient(rgba(51, 65, 85, 0.82), rgba(51, 65, 85, 0.82)), url('../fondocentral.jpg');
            background-size: 100% auto;
            background-position: 50% 50%;
            padding: 3rem 1rem;
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            box-shadow: inset 0 10px 15px -10px rgba(0, 0, 0, 0.3);
            margin: 0;
            border-radius: 0;
        }

        /* --- RECUADRO CENTRAL (Más largo y espacioso) --- */
        .content-box {
            background-color: #D3D3D3; 
            color: #0f172a;
            width: 100%;
            max-width: 1100px; 
            padding: 3.5rem 2.5rem; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        /* --- DISEÑO DE DOS COLUMNAS --- */
        .ubicacion-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .ubicacion-col h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #0f172a;
            border-bottom: 2px solid #94a3b8;
            padding-bottom: 0.4rem;
        }

        /* Subtítulos internos secundarios */
        .ubicacion-col h3 {
            font-size: 1.15rem;
            margin-top: 1.8rem;
            margin-bottom: 0.6rem;
            color: #1b2a4a;
        }

        .ubicacion-col p {
            color: #334155;
            line-height: 1.6;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        /* Estilo para la imagen de la tabla climática con bordes casi rectos (4px) */
        .climate-table-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 1rem;
            border: 1px solid #94a3b8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: block;
            filter: saturate(85%) contrast(95%);
        }

        /* Contenedor del mapa con filtro integrado para unificarlo con el fondo */
        .map-container {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            border: 1px solid #94a3b8;
            background-color: #cbd5e1;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            filter: saturate(80%) contrast(95%);
        }
