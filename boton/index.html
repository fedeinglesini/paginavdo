<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botón de metal 3D - VdO</title>
    <!-- Logo en la pestaña del navegador (sube un nivel con ../) -->
    <link rel="icon" type="image/png" href="../logoizq.png?v=2">
    
    <!-- ========================================== -->
    <!-- MOTOR DE GOOGLE (OBLIGATORIO)              -->
    <!-- No borrar: Es la librería que lee el 3D    -->
    <!-- ========================================== -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        /* ========================================== */
        /* ESTILOS DE LA PANTALLA (OBLIGATORIO)       */
        /* ========================================== */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a; /* Color de fondo general */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative; /* Ancla necesaria para los elementos flotantes */
        }
        
        .logo-fondo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 75%;
            max-height: 75%;
            opacity: 0.15; /* Opacidad sutil para no tapar el objeto 3D */
            z-index: 1; /* Queda detrás del model-viewer */
            pointer-events: none; /* No interfiere con los clics/gestos */
            user-select: none;

             }
        
        model-viewer {
            width: 100%;
            height: 100%;
             position: relative;
            z-index: 2; /* Se coloca por encima del logo de fondo */
            --poster-color: transparent; /* Mantiene el fondo transparente al cargar */
        }

        /* ========================================== */
        /* ESTILOS: DESCRIPCIÓN SEMI-TRANSPARENTE     */
        /* Si borrás este bloque, borrá también el HTML abajo */
        /* ========================================== */
        .caja-descripcion {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5); /* Fondo negro semitransparente */
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 13px;
            max-width: 280px;
            z-index: 10;
            pointer-events: none; /* Hace que el dedo atraviese el texto y mueva el 3D */
        }
    </style>
</head>
<body>
<img src="../logoder.png" alt="Logo Fondo" class="logo-fondo">
    <!-- ========================================== -->
    <!-- APARTADO: VISOR 3D PRINCIPAL (OBLIGATORIO) -->
    <!-- Recordá subir el archivo sin espacios ni 'ñ'-->
    <!-- ========================================== -->
    <model-viewer 
        src="Boton.glb" 
        alt="Pieza arqueológica" 
        camera-controls 
        shadow-intensity="0"
        exposure="1"
        environment-image="../studiocalido.hdr"
        auto-rotate
        rotation-per-second="15deg"
        interaction-prompt="none"
        ar>
    </model-viewer>

    <!-- ========================================== -->
    <!-- APARTADO: CAJA DE DESCRIPCIÓN (OPCIONAL)   -->
    <!-- Modificá el texto o borrá todo este bloque -->
    <!-- ========================================== -->
    <div class="caja-descripcion">
        <b>Botón de metal</b><br>
        Botón utilizado en el uniforme de la Confederación Argentina, curiosamente fue fabricado en Francia. En el reverso del botón se puede leer "París" indicando que proviene de dicha ciudad
    </div>

</body>
</html>
