<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragmento de proyectil 3D - Vd</title>
    <!-- Logo en la pestaña del navegador (sube un nivel con ../) -->
    <link rel="icon" type="image/png" href="../logoizq.png?v=2">
    
    <!-- MOTOR DE GOOGLE (OBLIGATORIO) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            --poster-color: transparent;
        }
        
        .logo-fondo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 70%;
            max-height: 70%;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }
        
        .caja-descripcion {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 13px;
            max-width: 280px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <img src="../logoder.png" alt="Logo Fondo" class="logo-fondo">

    <!-- ========================================== -->
    <!-- MODEL-VIEWER CON OPCIONES VISUALES       -->
    <!-- ========================================== -->
    <model-viewer 
        src="Fragmento.glb" 
        alt="Pieza arqueológica" 
        camera-controls 
        shadow-intensity="0"
        exposure="1"
        environment-image href="../studiofresco.hdr"
        auto-rotate
        rotation-per-second="15deg"
        interaction-prompt="none"
        ar>
    </model-viewer>

    <div class="caja-descripcion">
        <b>Fragmento de proyectil</b><br>
        Fragmento de proyectil encontrado en el sitio Vuelta de Obligado
    </div>

</body>
</html>
